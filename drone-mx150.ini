; COLMAP 4.2.1 tuned config — DRONE + MX150 2GB (DJI nadir 4000x3000, overlap 70-90%)
; Dataset: <primary-photos-dir> (117 foto DJI nadir, alt ~45m)
; Budget: GeForce MX150 2GB CC 6.1. G1 baseline — tanpa compile, config-only.
; Pakai: colmap patch_match_stereo --project_path drone-mx150.ini
;
; Beda vs drone-rtx3050.ini: max_image_size 2000->1400, cache 16->4,
; __auto__ 8->6, num_samples 15->10 (hemat VRAM & waktu di Pascal).

; patch-match.cfg: pakai "__auto__ 6" per ref image.

; Depth dari altitude DJI XMP (RelativeAltitude ~45m, 15 AGUSTUS):
; uncomment bila mau kunci sampling (lebih cepat + bersih):
;depth_min = 20
;depth_max = 80

[PatchMatchStereo]
max_image_size = 1400
gpu_index = 0
window_radius = 5
window_step = 1
num_samples = 10
num_iterations = 4
min_triangulation_angle = 1.0
max_triangulation_angle = 15.0
geom_consistency = true
geom_consistency_regularizer = 0.3
geom_consistency_max_cost = 3.0
filter = true
filter_min_ncc = 0.15
filter_min_triangulation_angle = 3.0
filter_min_num_consistent = 2
filter_geom_consistency_max_cost = 1.0
cache_size = 4

[StereoFusion]
min_num_pixels = 3
max_reproj_error = 4.0
max_depth_error = 0.05
max_normal_error = 20.0
check_num_images = 30
