; COLMAP 4.2.1 tuned config — DRONE ONLY (DJI nadir, overlap 70-90%)
; Bukan MVS generik. Acuan: 80 foto DJI, RTX 3050 Laptop 4GB.
; Pakai: colmap patch_match_stereo --project_path drone-rtx3050.ini
; Setara perilaku Metashape High (downscale ~0.5 di 20MP).

; patch-match.cfg: pakai "__auto__ 8" per ref image (8 tetangga overlap
; terbaik; drone overlap tinggi, >8 buang waktu tanpa tambah akurasi).

; Pangkas depth dari altitude terbang (meter) bila tahu, misal terbang
; 100m: depth_min 50, depth_max 200. Sampling menyempit = cepat + bersih.
; Kosongkan (-1) bila tak yakin; COLMAP estimasi dari sparse.
;depth_min = -1
;depth_max = -1

[PatchMatchStereo]
max_image_size = 2000
gpu_index = 0
window_radius = 7
window_step = 1
num_samples = 15
num_iterations = 5
min_triangulation_angle = 1.0
max_triangulation_angle = 15.0
geom_consistency = true
geom_consistency_regularizer = 0.3
geom_consistency_max_cost = 3.0
filter = true
filter_min_ncc = 0.15
filter_min_triangulation_angle = 3.0
filter_min_num_consistent = 2
filter_geom_consistency_max_cost = 1.0
cache_size = 16

[StereoFusion]
min_num_pixels = 3
max_reproj_error = 4.0
max_depth_error = 0.05
max_normal_error = 20.0
check_num_images = 50
